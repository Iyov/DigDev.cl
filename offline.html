<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión - DigDev Solutions</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1193d4" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #101c22 0%, #1a2f3a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container {
            max-width: 500px;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: #1193d4;
            margin-bottom: 1rem;
        }
        .logo i { margin-right: 0.5rem; }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        p {
            color: #9ca3af;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: #1193d4;
            color: #fff;
            padding: 0.875rem 2rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #0d7ab3;
            transform: translateY(-2px);
        }
        .icon {
            font-size: 4rem;
            color: #1193d4;
            margin-bottom: 1.5rem;
        }
    </style>
    <link rel="stylesheet" href="css/font-awesome_6.5.1_all.min.css" />
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-code"></i>DigDev
        </div>
        <i class="fas fa-wifi-slash icon"></i>
        <h1>Sin conexión</h1>
        <p>
            No tienes conexión a internet. 
            Verifica tu conexión y vuelve a intentarlo.
        </p>
        <a href="/" class="btn" onclick="window.location.reload(); return false;">
            <i class="fas fa-sync-alt"></i> Reintentar
        </a>
    </div>
</body>
</html>
